{
  "python_exec": "python",
  "run": {
    "dataset": "2wiki",
    "max_samples": 1000,
    "run_phase1": true,
    "run_phase2": true,
    "run_evaluation": true
  },
  "scripts": {
    "phase1": "components/phase1_run.py",
    "phase2": "components/phase2_run.py",
    "evaluation": "components/eval_run.py"
  },
  "paths": {
    "query_json": "planner_queries/2wiki_data/query_graph_2wiki.json",
    "raw_data_json": "dataset/2wikimultihopqa.json",
    "data_json": "dataset/2wikimultihopqa.json",
    "kg_path": "KGs/KG_2wiki",
    "result_dir": "outputs/robustness/2wiki/gpt",
    "phase1_output": "phase1_evidence.json",
    "phase2_output": "phase2_evidence.json",
    "eval_output": "qa_results_with_recall.json"
  },
  "global_env": {
    "OPENAI_API_KEY": "",
    "OPENAI_BASE_URL": "",
    "OPENAI_MODEL": "gpt-4o-mini"
  },
  "phase1": {
    "env": {
      "EMB_MODEL": "sentence-transformers/all-MiniLM-L6-v2",
      "EMB_DEVICE": "cpu",
      "TOP_N_LLM": 5,
      "RELATION_VARIANTS": 3,
      "TOP_K_ENTITY": 3,
      "RELATION_K": 8,
      "NEFF_THRESHOLD": 1.6,
      "RERANK_MODEL": "BAAI/bge-reranker-v2-m3",
      "RERANK_MAX_LENGTH": 128,
      "RERANK_BATCH": 32,
      "RERANK_FP16": 1,
      "INCLUDE_QUESTION_IN_RERANK": 1
    }
  },
  "phase2": {
    "env": {
      "EMB_MODEL": "sentence-transformers/all-MiniLM-L6-v2",
      "EMB_DEVICE": "cpu",
      "UNRES_TOP_SIMILAR": 8,
      "TOPK_UNRESOLVED": 5,
      "RERANK_MODEL": "BAAI/bge-reranker-v2-m3",
      "RERANK_MAX_LENGTH": 512,
      "RERANK_BATCH": 32,
      "RERANK_FP16": 1
    }
  },
  "evaluation": {
    "env": {}
  }
}
